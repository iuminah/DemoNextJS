name: Deploy My App

on:
  push:
    branches:
      - main  # File này sẽ chạy mỗi khi bạn push vào nhánh 'main'

jobs:
  deploy:
    runs-on: self-hosted  # Phải là 'self-hosted' để nó chạy trên máy của bạn
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show current path
        run: |
          # Dòng này giúp bạn xác nhận code đang tải về đâu
          Write-Host "Current location is:"
          Get-Location
          
      - name: Verify files
        run: |
          # Liệt kê các file để bạn kiểm tra xem code đã tải về đủ chưa
          Get-ChildItem -Recurse
